[[faq]]
question = "How much does Squarespace cost?"
answer = """
Squarespace's Core plan is $39/mo billed monthly, or $29/mo if you prepay a year ($348). Email through Google Workspace is included for the first year, then paid per user.
"""

[[faq]]
question = "How much does Wix cost?"
answer = """
Wix's Core plan is $36/mo billed monthly, or $29/mo if you prepay a year ($348). Email on your domain is not included and is sold separately.
"""

[[faq]]
question = "Is Wix or Squarespace better?"
answer = """
Both are capable website builders at similar prices. The bigger differences are what's included and what you own: neither includes ongoing email on its Core plan, and you can't take your site's code with you if you leave. Archival includes email and analytics for $15/mo, and your site lives in a Git repo you own.
"""

[[faq]]
question = "What does Archival cost?"
answer = """
Archival Pro is $15/mo, billed monthly. It includes hosting, a custom domain, 5 email addresses on your domain ($0.50/mo for each one after that), cookieless analytics, and $5 of AI editing usage each month (billed at cost after that).
"""
