[[faq]]
question = "What does Archival cost?"
answer = """
Archival Pro is $15/mo, billed monthly. It includes hosting, a custom domain (renewal included when registered with us), 5 email addresses on your domain ($0.50/mo for each one after that), cookieless analytics, and $5 of AI editing usage each month (billed at cost after that).
"""

[[faq]]
question = "How does that compare to Squarespace and Wix?"
answer = """
Squarespace's Core plan is $39/mo billed monthly and Wix's Core plan is $36/mo, or $29/mo for either if you prepay a year ($348). Squarespace includes Google Workspace email for the first year only; Wix doesn't include email on your domain.
"""

[[faq]]
question = "Should I pick Squarespace, Wix, or Archival?"
answer = """
All three can build a good-looking site. Squarespace and Wix cost more than twice as much, don't include ongoing email, and keep your site on their servers. Archival includes email and analytics for $15/mo, and your site lives in a Git repo you own.
"""

[[faq]]
question = "Who's behind Archival?"
answer = """
Archival is independent and self-funded, so we answer to customers, not investors. Your site lives in a repo you own, and the code is yours.
"""
