[[faq]]
key = "cost"
question = "What does Archival cost?"
answer = """
Archival Pro is $15/mo, billed monthly. It includes hosting, a custom domain (renewal included when registered with us), 5 email addresses on your domain ($0.50/mo for each one after that), cookieless analytics, and $5 of AI editing usage each month (billed at cost after that).
"""

[[faq]]
key = "about"
question = "Who's behind Archival?"
answer = """
Archival is independent and self-funded, so we answer to customers, not investors. Your site lives in a repo you own, and the code is yours.
"""
