order = -1
title = "Websites That Take Payments"
description = "Connect your own Stripe account to your Archival site and sell from it. Buyers pay you directly on Stripe Checkout, and Archival takes no fee on sales."
tagline = "Connect your own Stripe account and sell from your site. Buyers pay you directly on Stripe's checkout page. Archival takes no fee on sales and never holds your money."
cta_label = "Get started in the editor"
cta_url = "https://editor.archival.dev/new"
docs_label = "Read the docs"
docs_url = "/docs/payments"
setup_title = "Get set up"
setup_intro = "Four steps. Connecting takes about a minute once your site is on a plan that includes Payments."
plan_note = """
Payments is included with Archival Pro ($15/mo) and White Glove ($150/mo). Archival takes no fee on sales. Stripe's own processing fees apply. [See pricing](/pricing).
"""
providers_note = """
Prefer Square? [A site can connect a Square account instead](/docs/payments#Square).
"""
closing_title = "Start selling from your site."
closing_content = """
Build a site, put it on Pro, and connect Stripe from its settings.

Already on Archival? Open your site's Settings, then Payments. The [docs](/docs/payments) have working examples of the buy button, the cart and the order confirmation.
"""

[[steps]]
title = "Sign up or sign in"
content = """
Go to [editor.archival.dev](https://editor.archival.dev) and create an account, or sign in to the one you have. Open the site you want to sell from, or build a new one.
"""

[[steps]]
title = "Choose a plan with Payments"
content = """
Put the site on Pro or White Glove. Payments is included with both, at no extra charge.
"""

[[steps]]
title = "Connect Stripe"
content = """
Open the site's Settings, then Payments, and choose **Connect Stripe**.
"""

[[steps]]
title = "Approve access in Stripe"
content = """
Stripe asks which account to connect. Approve access, and you are returned to your site's settings, connected.
"""

[[sections]]
key = "connect"
title = "Connect your own Stripe account"
content = """
In your site's settings, open Payments, choose Connect Stripe and approve access. The connection belongs to that one site, and it is only used to read your catalog and to create and read checkouts.

You are the merchant of record. Disconnect from the same panel, or from your Stripe Dashboard, at any time.
"""

[[sections]]
key = "catalog"
title = "Your products stay in Stripe"
content = """
Products and prices are made in Stripe, where you already manage them. Your site reads them to show what is for sale, so there is nothing to import or re-enter in Archival.

Change a price or archive a product in Stripe and your site picks it up within minutes, without a deploy.
"""

[[sections]]
key = "checkout"
title = "Checkout on Stripe's own page"
content = """
When a buyer checks out, your site starts a checkout in your Stripe account and sends them to Stripe's hosted payment page. They pay you directly, the money settles to your Stripe balance, and they come back to your site.

Sell one thing with a buy button, or add the cart script and let buyers collect several first.
"""

[[benefits]]
title = "You are the merchant"
content = """
Buyers pay you, not Archival. Payments settle to your own Stripe balance, and Archival never holds your money.
"""

[[benefits]]
title = "No fee on sales"
content = """
Archival takes nothing from a sale. Payments is included with Pro and White Glove, and the only processing fees are Stripe's.
"""

[[benefits]]
title = "One catalog"
content = """
What you sell lives in Stripe and your site reads it. A price is never typed twice, and there is no second inventory to keep in step.
"""

[[benefits]]
title = "Still just a website"
content = """
Your pages build to static HTML. A small [carrier](/docs/carriers) starts the checkout and Stripe takes the card. There is no shop platform to run.
"""
