order = -1
title = "Websites That Take Payments"
description = "Connect your own payment account to your Archival site and sell from it. Buyers pay you directly on your provider's checkout page, and Archival takes no fee on sales."
tagline = "Connect your own payment account and sell from your site. Buyers pay you directly on your provider's checkout page. Archival takes no fee on sales and never holds your money."
cta_label = "Get started in the editor"
cta_url = "https://editor.archival.dev/new"
docs_label = "Read the docs"
docs_url = "/docs/payments"
setup_title = "Get set up"
setup_intro = "Four steps. Connecting takes a few minutes once your site is on a plan that includes Payments."
plan_note = """
Payments is included with Archival Pro ($15/mo) and White Glove ($150/mo). Archival takes no fee on sales. Your provider's own processing fees apply. [See pricing](/pricing).
"""
providers_title = "What differs between providers"
providers_intro = "A site connects an account at Stripe or Square, and is built the same way on either. Checkout, your catalog and what Archival charges are the same. These are the differences."
providers_more = """
[The full comparison](/docs/payments#Payment%20providers) is in the docs, with what each difference means for the site you build.
"""
closing_title = "Start selling from your site."
closing_content = """
Build a site, put it on Pro, and connect your payment account from its settings.

Already on Archival? Open your site's Settings, then Payments. The [docs](/docs/payments) have working examples of the buy button, the cart and the order confirmation.
"""

[[steps]]
title = "Sign up or sign in"
content = """
Go to [editor.archival.dev](https://editor.archival.dev) and create an account, or sign in to the one you have. Open the site you want to sell from, or build a new one.
"""

[[steps]]
title = "Choose a plan with Payments"
content = """
Put the site on Pro or White Glove. Payments is included with both, at no extra charge.
"""

[[steps]]
title = "Choose your provider"
content = """
Open the site's Settings, then Payments, and choose the provider your account is with: Stripe or Square. See [what differs between them](#providers).
"""

[[steps]]
title = "Connect your accounts"
content = """
Your provider asks which account to connect. Approve access for the live account your site sells from, then connect a test account the same way. Payments is on once both are connected, and the editor's preview checks out in the test one.
"""

[[sections]]
key = "connect"
title = "Connect your own payment account"
content = """
In your site's settings, open Payments, choose your provider and connect two accounts: the live one your site sells from, and a test one the editor's preview checks out in. A connection is only used to read your catalog and to create and read checkouts.

You are the merchant of record. Disconnect from the same panel, or from your provider's dashboard, at any time.
"""

[[sections]]
key = "catalog"
title = "Your products stay where you manage them"
content = """
Products and prices are made at your payment provider, where you already manage them. Your site reads them to show what is for sale, so there is nothing to import or re-enter in Archival.

Change a price or take a product off sale there and your site picks it up within minutes, without a deploy.
"""

[[sections]]
key = "checkout"
title = "Checkout on your provider's own page"
content = """
When a buyer checks out, your site starts a checkout in your payment account and sends them to your provider's hosted payment page. They pay you directly, the money settles to your own account, and they come back to your site.

Sell one thing with a buy button, or add the cart script and let buyers collect several first.
"""

