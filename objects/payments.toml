[[benefits]]
title = "You are the merchant"
content = """
Buyers pay you, not Archival. Payments settle to your own account at your provider, and Archival never holds your money.
"""

[[benefits]]
title = "No fee on sales"
content = """
Archival takes nothing from a sale. Payments is included with Pro and White Glove, and the only processing fees are your provider's.
"""

[[benefits]]
title = "One catalog"
content = """
What you sell lives in your payment account and your site reads it. A price is never typed twice, and there is no second inventory to keep in step.
"""

[[benefits]]
title = "Still just a website"
content = """
Your pages build to static HTML. A small [carrier](/docs/carriers) starts the checkout and your provider takes the card. There is no shop platform to run.
"""
