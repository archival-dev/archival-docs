order = 6
command = "archival postbuild"
description = "Run the commands listed in the manifest's postbuild field, in sequence, exiting non-zero on failure."
content = """
Runs the commands listed in the manifest postbuild field, in sequence, after `archival build`. Use it for steps that rewrite the build output, like fingerprinting asset filenames. If any command fails, this will print the failure and exit non-zero.
"""

[[options]]
flags = "-h, --help"
description = "print help for this command."
[[arguments]]
arg = "[path/to/archival-site]"
description = "optionally specify a path to an archival site. By default will run in the current working directory. "
