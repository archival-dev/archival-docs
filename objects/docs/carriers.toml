order = 8
title = "Carriers"
include_in_llm_docs = true
description = """
Occasionally your website will need to do something using privileged keys (e.g. submit a form, call third party APIs, etc) - carriers are small javascript or typescript functions that can be used to abstract these calls so you don't leak your keys. They "carry information" to your website, should you need to use information not available at build time or via simple scripting.

Carriers are serverless and are deployed automatically whenever your site builds. Nothing a carrier holds in memory outlives the request; what it needs to keep goes in its site's database (see [Storing data](#Storing%20data)).

Once deployed, a carrier is reachable at `/carriers/<carrier-name>` on your site. For example, a carrier in `carriers/submit-form/` is served at `https://yoursite.com/carriers/submit-form`.
"""

[[sections]]
title = "Folder structure"
content = """
Carriers live in a top-level `carriers/` directory in your repo. Each subdirectory is a single carrier, and the directory name becomes the carrier's URL path:

```
carriers/
  submit-form/
    package.json        # names the carrier API version; "main" selects the entry file, "dependencies" are installed
    package-lock.json   # required when the carrier has dependencies
    index.ts            # the carrier's entry file
    archival-objects.d.ts  # generated by npx archival-carrier-types — commit this
    .gitignore          # ignores generated carrier_* build files
```

- The directory name (`submit-form` above) is the carrier name and the URL segment: `/carriers/submit-form`.
- By default the entry file is `index.ts`, `index.mts`, `index.js`, or `index.mjs` — whichever exists. If you include a `package.json`, its `main` field selects the entry file instead (e.g. `"main": "submit.ts"`).
- During a build, archival writes generated wrapper and config files named `carrier_*` into the carrier directory. Add `carrier_*` to a `.gitignore` so these build artifacts aren't committed.
"""

[[sections]]
title = "TypeScript carriers"
content = """
A carrier may be written in TypeScript or JavaScript. TypeScript's types are stripped when the carrier is built, so there is **no separate compile step to configure** — name your entry file `index.ts` and it just works.

Types are removed rather than compiled, which is the rule Node applies to `.ts` files. That rules out the few TypeScript features that generate code: `enum`, `namespace` and constructor parameter properties. An import used only as a type must say `import type`. Setting `erasableSyntaxOnly` and `verbatimModuleSyntax` in the carrier's `tsconfig.json` makes your editor hold you to both.

Because `npm init` writes `"main": "index.js"` by default, a `main` that points at a file which was never emitted is resolved against every supported extension before giving up. In other words, `"main": "index.js"` next to an `index.ts` finds the TypeScript file rather than failing the deploy.

To get types for the carrier signature itself, add [`@archival/carrier`](https://www.npmjs.com/package/@archival/carrier) as a dev dependency:

```sh
cd carriers/submit-form
npm install --save-dev @archival/carrier
```

```ts
import type { Carrier } from "@archival/carrier";

const carrier: Carrier = async (params, body, objects, site) => ({
  hello: params.get("name"),
  site: site.url,
});

export default carrier;
```

The package exports the whole contract, so you can name any part of it explicitly:

| Type | |
| --- | --- |
| `Carrier<Objects>` | The handler itself — the default export of your entry file. The type parameter is an escape hatch if you'd rather name your objects type than rely on the generated augmentation. |
| `CarrierParams` | The first argument: a `URLSearchParams`. |
| `CarrierBody` | The second argument: parsed JSON, a form body, text, or `null`. |
| `CarrierObjects` / `SiteObjects` | The third argument: your site's objects. |
| `CarrierSite` | The fourth argument: your site's `url`, `uploads`, `email` and `sql`. |
| `CarrierUploads` | `site.uploads`: `list()` and `get()`. |
| `CarrierUpload` | One upload's body and metadata, as `get()` resolves it. |
| `CarrierUploadEntry` | A `{ sha, filename }` pair, as `list()` returns them. |
| `CarrierEmail` | `site.email`: `send()`. |
| `CarrierSql` | `site.sql`: `exec()` and `transaction()`. |
| `CarrierSqlRow` | One row a query returns, keyed by column name. |
| `CarrierEmailMessage` | What `send()` takes: `from`, `to`, `subject`, `text`, `html` and `replyTo`. |
| `CarrierEmailReceipt` | What `send()` resolves to: the `id` of the send and the `from` it resolved to. |
| `CarrierFormBody` | A parsed form submission — `{ [key: string]: string \\| Blob }`. |
| `CarrierJsonValue` | Any value that survives a JSON round trip. |
| `CarrierResponse` | What a carrier may return. |

The package is types-only at runtime, so it belongs in `devDependencies` — nothing from it ships with the deployed carrier.
"""

[[sections]]
title = "Carrier API versions"
content = """
What archival hands a carrier is versioned, so it can change without breaking a carrier written against an earlier version. A carrier names the version it's written against in its `package.json`:

```json
{
  "type": "module",
  "archival": { "carrier": 2 },
  "devDependencies": { "@archival/carrier": "^1.0.0" }
}
```

Everything on this page describes **version 2**, which `@archival/carrier@1` types. A carrier that names no version is **version 1**, and always will be, so a carrier written before versions existed keeps working exactly as it was written. A version that doesn't exist fails the deploy with a message naming the file.

Version 1 carriers, typed by `@archival/carrier@0`, receive three arguments, `(params, body, objects)`, with `SITE_URL`, `UPLOADS` and `EMAIL` merged into `objects` over any object of the same name. To move one to version 2:

1. Add `"archival": { "carrier": 2 }` to its `package.json` and install `@archival/carrier@1`.
2. Take a fourth argument, `site`, and read `site.url`, `site.uploads` and `site.email` where you read `objects.SITE_URL`, `objects.UPLOADS` and `objects.EMAIL`.
3. Run `npx archival-carrier-types` again.

`objects` then holds only your site's objects, so an object named `SITE_URL`, `UPLOADS` or `EMAIL` is no longer hidden.
"""

[[sections]]
title = "How a carrier is built"
content = """
A carrier is built the same way everywhere it runs: when your site deploys, and in the preview in the Archival app. The build does three things, and nothing else:

1. **Installs** the packages your `package-lock.json` names.
2. **Strips** TypeScript's types from your files.
3. **Links** your files and your dependencies as the ES modules they are.

Nothing is bundled, and no build script is run. A `scripts.build` in the carrier's `package.json` is ignored, so `main` must name a source file rather than something a build would have emitted.

That gives a carrier two rules:

- **ES modules only.** Your files and every package you depend on must use `import` and `export`. A CommonJS file (`require`, `module.exports`, a `.cjs` extension) is refused, and so is a package that only publishes CommonJS.
- **Web APIs only.** `fetch`, `crypto.subtle`, `URL`, `TextEncoder`, `Response` and the rest of the web platform are there. Node built-ins (`node:fs`, `node:crypto`, `Buffer`) are not, and importing one is refused.

Imports of your own files may name the file with or without its extension (`./sheet` or `./sheet.ts`), and a `.json` file can be imported as its value.

When a carrier breaks one of these rules, the deploy fails with a message naming the file or package, and the preview answers the request with the same message.
"""

[[sections]]
title = "Dependencies"
content = """
A carrier can depend on npm packages. List them under `dependencies` in the carrier's `package.json` and **commit its `package-lock.json`** (or `npm-shrinkwrap.json`):

```json
{
  "type": "module",
  "main": "index.ts",
  "dependencies": {
    "nanoid": "^5.0.0"
  },
  "archival": { "carrier": 2 },
  "devDependencies": {
    "@archival/carrier": "^1.0.0",
    "typescript": "^5.8.0"
  }
}
```

The lockfile is what gets installed: each package is downloaded from the tarball it records and checked against its hash, so the same files are installed wherever the carrier is built. Dependencies with no lockfile fail the build. The lockfile must be version 2 or later, which is what npm 7 and up write.

- `devDependencies` are never installed, so that is where `@archival/carrier`, `typescript` and your test tools belong.
- Install scripts do not run, and a package that needs one to work will not.
- A package must publish ES modules that run on web APIs. Where a package offers both a Node build and a browser build, the browser build is the one a carrier gets.
"""

[[sections]]
title = "Carrier request signature"
content = """
A carrier's entry file must `export default` an async function that receives four arguments:

```js
export default async function (params, body, objects, site) {
  // ...your logic
}
```

- **`params`** — a [`URLSearchParams`](https://developer.mozilla.org/en-US/docs/Web/API/URLSearchParams) built from the request's query string.
- **`body`** — the parsed request body for `POST` and `PUT` requests (`null` for other methods). How it's parsed depends on the request's `Content-Type`:
  - `application/json` → a parsed JSON value
  - `application/x-www-form-urlencoded`, `multipart/form-data`, or `application/form` → an object of the form fields (file fields arrive as a `Blob`)
  - anything else → the raw request text
- **`objects`** — your site's objects (see below).
- **`site`** — what archival gives a carrier besides: your site's `url`, its `uploads`, its `email` and its database, `sql` (see below).

The function's return value determines the HTTP response:

- **An object** is serialized to a `200` JSON response (`content-type: application/json`).
- **A string** is returned as a `200` `text/plain` response. If the string begins with `redirect:`, the remainder is used as a `Location` header and a `302` redirect is sent instead.
- **A [`Response`](https://developer.mozilla.org/en-US/docs/Web/API/Response)** is sent as-is, for when you need to set your own status, headers, or body — serving a file, for instance.
- **Throwing an error** produces a `500` response containing the error message.
- Returning anything else produces a `500` response.

A minimal carrier that validates a form post and redirects back to the site:

```js
export default async function (params, body, objects, site) {
  if (!body) {
    throw new Error("Method Not Allowed");
  }
  // ...do something with the submitted fields...
  return "redirect:" + site.url + "?submitStatus=ok";
}
```
"""

[[sections]]
title = "The objects and site arguments"
content = """
`objects` is **your site's whole object tree**, so a carrier can read the same content your templates render without refetching or duplicating it.

```js
export default async function (params, body, objects) {
  return {
    titles: objects.posts.map((post) => post.title),
    contact: objects.settings.contact,
    hero: objects.posts[0].hero?.url,
  };
}
```

The values match what a liquid template sees:

- Objects backed by a directory (`objects/posts/*.toml`) arrive as an **array**, sorted the way archival sorts them. Objects backed by a single file (`objects/settings.toml`) arrive as a **single value**. An object with no files on disk is an empty array.
- Unset fields are `null`, and child objects default to `[]`.
- Every object read from its own file also carries `path` and `order`.
- File fields (`image`, `video`, `audio`, `upload`) carry their resolved `url`, alongside `filename`, `sha`, `mime` and `display_type`.
- `date` fields are ISO 8601 strings, since JSON has no date type.

`site` holds what archival gives a carrier besides your objects:

- **`site.url`** — the full URL of your site (e.g. `https://yoursite.com`). Use it to build absolute URLs for redirects and links rather than hard-coding your domain.
- **`site.uploads`** — the files uploaded to your site, readable at request time. See [Reading uploads](#Reading%20uploads).
- **`site.email`** — sends mail from your site's own email addresses. See [Sending email](#Sending%20email).
- **`site.sql`** — your site's own SQLite database. See [Storing data](#Storing%20data).

A few things worth knowing:

- Objects are **embedded at deploy time**, so a carrier sees a snapshot from the build it was deployed with, not live content. Publishing your site redeploys its carriers with fresh values. (`site.uploads`, `site.email` and `site.sql` act when the request runs.)
- The tree is **deeply frozen**, so one request can't mutate what the next request sees.
- Because they're embedded, there's an upper bound on how large a site's objects can be (5MB serialized). A site over that fails its carrier deploy rather than silently shipping a carrier with missing data.
"""

[[sections]]
title = "Reading uploads"
content = """
`site.uploads` reads the files you've [uploaded to your site](/docs/uploading-files.html). Unlike `objects` it isn't a snapshot — it reads at request time, so a carrier sees files uploaded since it was deployed. Reads are scoped to your own site, and there is no way to write.

This is what lets a carrier put a file behind a check your site can't make on its own — a password, a signed link, a purchase — or serve one under a name that isn't known until the request arrives.

`list()` gives every file, as the name it was uploaded with and the content hash it's stored under:

```ts
await site.uploads.list();
// [{ sha: "31f4725e…", filename: "cover.png" }, …]
```

`get()` reads one, by name, and resolves to `null` when nothing matches:

```ts
const upload = await site.uploads.get("cover.png");
```

Names aren't unique — the same name can be uploaded more than once, under different hashes — so looking one up by name alone **throws when it's ambiguous** rather than guessing. Pass the hash to say which you meant, or pass a file field straight off `objects`, which already carries its own:

```ts
await site.uploads.get("cover.png", "31f4725e…");
await site.uploads.get(objects.settings.menu);
```

What you get back is the file's body and metadata: `body`, `size`, `etag`, `httpEtag`, `arrayBuffer()`, `text()`, `json()`, `blob()`, and `writeHttpMetadata(headers)`, which copies the stored content type onto a `Headers` you're building.

Returning a `Response` is how you serve one back:

```ts
const carrier: Carrier = async (params, body, objects, site) => {
  if (params.get("password") !== objects.settings.download_password) {
    return "redirect:/login";
  }
  const upload = await site.uploads.get("private-menu.pdf");
  if (!upload) {
    return "redirect:/404";
  }
  const headers = new Headers();
  upload.writeHttpMetadata(headers);
  headers.set("etag", upload.httpEtag);
  return new Response(upload.body, { headers });
};
```

Bear in mind that a file which is already referenced by a published object is served from the CDN too, at its own `url` — reading it through a carrier doesn't hide it. Gating only means something for files nothing on your site links to.
"""

[[sections]]
title = "Sending email"
content = """
`site.email.send` sends mail from one of your site's own email addresses, so a carrier can confirm a form submission or tell you about an order from an address your visitors recognize. It needs a plan that includes email and at least one address on one of your site's domains — add those under Email in the site's settings in the editor.

```ts
const carrier: Carrier = async (params, body, objects, site) => {
  if (!body || typeof body.email !== "string") {
    throw new Error("Method Not Allowed");
  }
  await site.email.send({
    to: body.email,
    subject: "Thanks for getting in touch",
    text: "We got your message and will reply within a day.",
  });
  return "redirect:/thanks";
};
```

| Field | |
| --- | --- |
| `from` | One of your site's addresses. Defaults to the first address on your site's primary domain. A copy of every message lands in that address's Sent folder. |
| `to` | A single address, or up to ten. |
| `subject` | The subject line. |
| `text`, `html` | The body — at least one is required, and both may be given. |
| `replyTo` | Where replies go, when not `from`. |

`send` resolves once archival has accepted the message, with an `id` for its logs and the `from` it resolved to. Delivery happens afterwards; if it fails, the site's owner is emailed about it. `send` rejects when the message is not accepted: the site has no email, `from` is not one of its addresses, a recipient is malformed, or the site has used its hourly allowance (100 messages).

A few things worth knowing:

- A domain whose mail is received by another service — Google Workspace, say — can still send. Its addresses are sending-only: nothing arrives in them, and a carrier can't send *to* an address on such a domain, since that mail would never reach the service that receives it.
- `site.email` only works in a deployed carrier. In a preview or a local run, `send` throws.
- A carrier is reachable by anyone, so treat what a request asks you to send with care. A `to` taken straight from an untrusted body sends mail to whoever the request names; the recipient cap and the hourly allowance limit how far that goes, but validating the request is what keeps your site from being used as a relay.
"""

[[sections]]
title = "Storing data"
content = """
`site.sql` is your site's own SQLite database. Every carrier on the site shares it, and it keeps what it holds between requests and deploys — so a carrier can collect form submissions, count votes, or remember anything that isn't content you edit.

```ts
const carrier: Carrier = async (params, body, objects, site) => {
  await site.sql.exec(
    "CREATE TABLE IF NOT EXISTS signups (email TEXT PRIMARY KEY, at TEXT NOT NULL)",
  );
  await site.sql.exec(
    "INSERT INTO signups (email, at) VALUES (?, ?) ON CONFLICT DO NOTHING",
    body.email,
    new Date().toISOString(),
  );
  const [{ count }] = await site.sql.exec<{ count: number }>(
    "SELECT count(*) AS count FROM signups",
  );
  return { count };
};
```

`exec(sql, ...params)` runs one statement and resolves to its rows, each keyed by column name, binding `params` to the statement's `?` placeholders in order. `transaction(statements)` runs a list of `[sql, ...params]` statements in order and resolves to each one's rows:

```ts
await site.sql.transaction([
  ["UPDATE stock SET count = count - 1 WHERE sku = ?", sku],
  ["INSERT INTO orders (sku, email) VALUES (?, ?)", sku, body.email],
]);
```

**Every call is one transaction.** If a statement fails, the call rejects with SQLite's error and nothing it did is kept.

Strings, numbers and `null` are stored as they are, booleans as `1` and `0`, and bytes (`Uint8Array`, `ArrayBuffer`) as blobs, which read back as a `Uint8Array`.

Each site's database has limits, and a call that would go past one rejects:

| Limit | |
| --- | --- |
| Requests | 5,000 calls an hour. |
| Rows read | 5,000,000 an hour. A scan reads every row it passes, so index the columns your queries filter on. |
| Rows written | 5,000 an hour. A call that would pass it is rolled back. |
| Size | 500 MB. A call that would grow the database past it is rolled back; deleting rows always works. |
| One call | 100 statements, and 5 MB of rows back. |

A few things worth knowing:

- `site.sql` only works in a deployed carrier. In the preview in the Archival app and under `archival run`, it rejects.
- A carrier is reachable by anyone, so whatever a request can make it write, anyone can. Validate what you store, and bind values with `?` rather than building SQL from a request.
"""

[[sections]]
title = "Typing your site's objects"
content = """
{% raw %}
Every site's objects are different, so the types for them are generated from your `archival_objects.toml`. From a carrier directory that has `@archival/carrier` installed:

```sh
npx archival-carrier-types
```

That runs [`archival types`](/cli/types.html) and writes an `archival-objects.d.ts` next to each carrier — a self-contained module declaring an `ArchivalObjects` interface, followed by the one block that wires it into the carrier signature:

```ts
declare module "@archival/carrier" {
  interface SiteObjects extends ArchivalObjects {}
}
```

Each carrier gets the block for the [carrier API version](#Carrier%20API%20versions) its `package.json` names, and the generator refuses a carrier whose installed `@archival/carrier` types a different version than the one it names.

**Commit those files.** They contain no object values, only your schema, and committing them means your editor and CI work on a fresh clone with no extra setup.

After generating, `objects` is fully typed:

```ts
const carrier: Carrier = async (params, body, objects) => ({
  titles: objects.posts.map((post) => post.title), // (string | null)[]
  contact: objects.settings.contact,
  hero: objects.posts[0].hero?.url,
});
```

Until you generate, reading anything off `objects` is a compile error — deliberately, so a carrier can't silently read an object that isn't there.

The generator needs the `archival` binary on your `PATH` or in your `node_modules` (`npm install --save-dev archival`, or `cargo install archival`).

| Flag | |
| --- | --- |
| `--check` | Don't write; exit non-zero if anything is out of date. For CI. |
| `--carrier <name>` | Only generate for one carrier. |
| `--carriers-dir <path>` | Carriers directory, if not `carriers`. |
| `--site <path>` | Site root, if not an ancestor of the working directory. |
| `--out <path>` | Write a single file here instead of one per carrier. |
| `--archival <path>` | Path to the archival binary. |

The output is deterministic, so it's safe to keep honest in CI:

```sh
npx archival-carrier-types --check
```
{% endraw %}
"""

[[sections]]
title = "Reading secrets"
content = """
Fields declared [`secret`](/docs/object-fields.html#secret) are stripped from template contexts, but carriers run on the server and **do** receive their values — that's the point of the type. They're typed as `string | null` like any other string field.

```ts
const carrier: Carrier = async (params, body, objects) => {
  const response = await fetch("https://api.example.com/send", {
    headers: { authorization: `Bearer ${objects.settings.api_key}` },
  });
  return { ok: response.ok };
};
```

A secret set through the archival editor is stored encrypted in your repo, and archival decrypts it when it deploys your carriers, so `objects` always holds the value you typed. A secret you write into an object file by hand is committed as plain text. See [Secrets](/docs/secrets.html) for when each applies.
"""
