#:schema https://archival.dev/schemas/archival_objects.schema.json
# This file is used to define the objects available on your site.

[home]
title = "string"
description = "string"
header = "image"
header_alt = "string"
logo = "image"
manifesto_link_title = "string"
videos_title = "string"
personas_title = "string"
contact_title = "string"
pricing_title = "string"
pricing_content = "markdown"
discord_url = "string"

[home.sections]
title = "string"
content = "markdown"

[home.videos]
title = "string"
video = "video"
poster = "string"

[pricing]
title_line_1 = "string"
title_line_2 = "string"
tagline = "string"
usage_summary = "string"
usage_limits = "markdown"

[pricing.tiers]
icon = "string"
name = "string"
audience = "string"
price = "string"
term = "string"
slug = "string"
features = "markdown"
cta_label = "string"
cta_url = "string"
featured = "boolean"

[manifesto]
title = "string"
content = "markdown"

[docs]
title = "string"
description = "markdown"
include_in_llm_docs = "boolean"
build_cta = "boolean"
template = "docs"
[docs.sections]
title = "string"
content = "markdown"

[cli]
command = "string"
description = "string"
content = "markdown"
template = "cli"
[cli.options]
flags = "string"
description = "string"
[cli.arguments]
arg = "string"
description = "string"

[eula]
content = "markdown"

[terms_of_service]
content = "markdown"

[privacy_policy]
content = "markdown"

[product]
title = "string"
description = "string"
[product.sections]
key = "string"
title = "string"
content = "markdown"

[social_web]
title = "string"
description = "string"
tagline = "string"
cta_label = "string"
cta_url = "string"
docs_label = "string"
docs_url = "string"
standards_title = "string"
standards_intro = "string"
closing_title = "string"
closing_content = "markdown"

[social_web.standards]
kicker = "string"
name = "string"
url = "string"
link_label = "string"
blurb = "string"
extra_label = "string"
extra_url = "string"

[social_web.sections]
key = "string"
title = "string"
content = "markdown"

[social_web.benefits]
title = "string"
content = "markdown"

[pay_less_get_more]
# Page <title> before the " | Archival" suffix, and the meta description.
title = "string"
description = "string"
headline = "string"
subhead = "string"
cta_label = "string"
templates_link_label = "string"
templates_title = "string"
templates_intro = "string"
features_title = "string"
# The editor frame's first callout, in place of the homepage's wording.
mode_callout = "string"
features_intro = "string"
compare_title = "string"
compare_intro = "string"
# Column headers for the comparison table.
archival_label = "string"
squarespace_label = "string"
wix_label = "string"
prices_checked = "string"
faq_title = "string"
# The line above the closing section's button.
final_line = "string"

# The template cards under the hero. Each opens that template in the editor's
# gallery, so all three fields must match the editor's catalog
# (editor.archival.dev/templates.json).
[pay_less_get_more.templates]
name = "string"
# The editor's slug for the name (src/journey.ts slug()), used for the route
# hash and for this page's image files: public/img/templates/<slug>-400.avif,
# -400.webp, -640.avif and -640.webp.
slug = "string"
# TemplateObject::identifier(): provider, owner, repo, ref and name, each
# percent-encoded, joined by "/". Stored encoded; the page encodes it again.
template_id = "string"

[pay_less_get_more.features]
# Must be a product tour frame: prompt, editor, media, settings or history.
key = "string"
title = "string"
content = "markdown"

# The row of cards under the product tour.
[pay_less_get_more.benefits]
title = "string"
content = "markdown"

[pay_less_get_more.rows]
label = "string"
archival = "string"
squarespace = "string"
wix = "string"
# Optional icon before each cell's text: yes, no, partly, lower or higher
# (for prices), or empty for none.
archival_mark = "string"
squarespace_mark = "string"
wix_mark = "string"

[pay_less_get_more.faq]
question = "string"
answer = "markdown"

[showcase]
title = "string"
tagline = "string"

[showcase.sites]
name = "string"
url = "string"
screenshot = "image"
description = "string"
built_by = "string"

[showcase.quotes]
quote = "markdown"
author = "string"
role = "string"
site_url = "string"

[comments]
# Lets the team post as the team and hide comments.
admin_token = "secret"
# Fediverse accounts, servers, or pages whose replies and mentions are left out.
[comments.blocked]
url = "string"

[author]
key = "string"
name = "string"
role = "string"
photo = "image"

[update]
title = "string"
publish_date = "date"
# Must match a key from an author object. Empty is a team update.
author = "string"
summary = "string"
body = "markdown"
# Pins the update to the fediverse profile (see `featured` in archival_editor.toml).
pinned = "boolean"
template = "update"

[update.media]
alt = "string"
poster = "string"
width = "number"
height = "number"
[[update.media.file]]
name = "image"
type = "image"
[[update.media.file]]
name = "video"
type = "video"
