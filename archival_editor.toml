allow_mastodon_clients = true

[[shortcuts]]
name = "Post Update"
path = "update"

[[shortcuts]]
name = "New Case Study"
path = "showcase"

[[activitypub]]
domain = "archival.dev"
username = "updates"
follow = ["@bsky.brid.gy@bsky.brid.gy", "@threads@threads.net"]

[activitypub.actor]
object = "home"
summary = "description"
icon = "logo"

[activitypub.objects.update]
featured = "pinned"
name = "title"
content = "body"
published = "publish_date"

[[activitypub]]
domain = "archival.dev"
username = "showcase"
follow = ["@bsky.brid.gy@bsky.brid.gy", "@threads@threads.net"]

[activitypub.actor]
object = "showcase_page"
name = "title"
summary = "tagline"
icon = "icon"

[activitypub.objects.showcase]
featured = "pinned"
name = "title"
content = "body"
published = "publish_date"
image = "screenshot"

[atproto]
domain = "archival.dev"

[atproto.actor]
object = "home"
summary = "description"
icon = "logo"

[atproto.publication]
object = "home"
summary = "description"
icon = "logo"

# Each document's page carries its site.standard.document link from layout/theme.liquid.
[atproto.objects.update]
type = "Document"
featured = "pinned"
name = "title"
summary = "summary"
content = "body"
published = "publish_date"

[atproto.objects.showcase]
type = "Document"
featured = "pinned"
name = "title"
summary = "summary"
content = "body"
published = "publish_date"
image = "screenshot"

# Mentions of any page are received. Each update and case study also sends a
# mention to every page it links to, authored as the site.
[webmention]
domain = "archival.dev"

[webmention.author]
object = "home"
name = "title"
photo = "logo"

[webmention.objects.update]
name = "title"
content = "body"
published = "publish_date"

[webmention.objects.showcase]
name = "title"
content = "body"
published = "publish_date"
