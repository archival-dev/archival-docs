[[shortcuts]]
name = "Post Update"
path = "update"

[activitypub]
domain = "archival.dev"
username = "updates"
follow = ["@bsky.brid.gy@bsky.brid.gy", "@threads@threads.net"]

[activitypub.actor]
object = "home"
summary = "description"
icon = "logo"

[activitypub.objects.update]
featured = "pinned"
name = "title"
content = "body"
published = "publish_date"

# Mentions of any page are received. Each update also sends a mention to every
# page it links to, authored as the site.
[webmention]
domain = "archival.dev"

[webmention.author]
object = "home"
name = "title"
photo = "logo"

[webmention.objects.update]
name = "title"
content = "body"
published = "publish_date"
